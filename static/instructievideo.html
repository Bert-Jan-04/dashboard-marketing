const { useState, useEffect, useRef, useCallback } = React;

// ── Timeline layout (seconds) ───────────────────────────────────────────────

const CHAPTERS = [

  { t: T.pipe,   label: 'Wat is dit' },
  { t: T.src,    label: 'Databronnen' },
  { t: T.mod,    label: 'Modules' },

// ── Scene boundaries (every point where a slide swaps) ───────────────────────
// The narrator must never let the playhead drift across one of these while a
// sentence is still being spoken — otherwise the slide changes mid-sentence and
// the speaker gets cut off. The scene only swaps when the NEXT sentence starts.
const SCENE_BOUNDS = Object.values(T).sort((a, b) => a - b);
// Smallest boundary strictly greater than `t` (i.e. the end of t's scene).
function sceneEndAfter(t) {
  for (let i = 0; i < SCENE_BOUNDS.length; i++) {
    if (SCENE_BOUNDS[i] > t + 1e-6) return SCENE_BOUNDS[i];
  }
  return T.end;
}

// ── Captions / narration cues ───────────────────────────────────────────────

// ── Voice-over (browser TTS, optional, off by default) ──────────────────────
// Narration-gated playback: the timeline only advances between sentences and
// holds while a sentence is still being spoken, so nothing gets cut off and
// voice + captions stay in sync. When the voice is OFF, playback runs normally.
function pickDutchVoice() {
  if (!('speechSynthesis' in window)) return null;
  const vs = window.speechSynthesis.getVoices();
  const nl = vs.filter(v => /^nl/i.test(v.lang));
  return nl.find(v => /google/i.test(v.name))
      || nl.find(v => /natural|premium|enhanced|neural/i.test(v.name))
      || nl.find(v => !v.localService)
      || nl[0] || null;
}

// Smooth out punctuation that TTS reads awkwardly.
function cleanForSpeech(t) {
  return t
    .replace(/…/g, ' ')
    .replace(/—/g, ', ')
    .replace(/·/g, ', ')
    .replace(/\.env\b/gi, 'punt-env')
    .replace(/\bGA4\b/g, 'G A 4')
    .replace(/\bGSC\b/g, 'G S C')
    .replace(/\bCTR\b/g, 'C T R')
    .replace(/\s+/g, ' ')
    .replace(/^[\s,.:–-]+/, '')
    .trim();
}

const VOICE_RATE = 0.92;
const IN_DUR = 0.5;        // s — smooth glide from previous beat to the new one
const DRIFT_RATE = 0.16;   // timeline-sec per real-sec — gentle life during a sentence
const DRIFT_MAX = 1.5;     // cap on that drift

// Narration-MASTER playback. When the voice is on, the speaker drives:
// sentences play back-to-back with no gaps, and the playhead glides to each
// sentence's beat so the slides move with the voice. When off, normal autoplay.
function Narrator({ cues, voiceOn }) {
  const { time, playing, setPlaying, setTime } = useTimeline();
  const beatRef = useRef(0);          // beat currently being narrated
  const posRef = useRef(time);        // authoritative playhead while narrating
  const fromRef = useRef(time);       // playhead at start of current glide
  const segStartRef = useRef(0);      // performance.now() at beat start
  const speakingRef = useRef(false);
  const voiceOnRef = useRef(voiceOn);
  const timeRef = useRef(time);
  const rafRef = useRef(null);
  const inDurRef = useRef(IN_DUR);

  useEffect(() => { voiceOnRef.current = voiceOn; }, [voiceOn]);
  useEffect(() => { timeRef.current = time; }, [time]);

  const activeCueIndex = useCallback((t) => {
    let i = 0;
    for (let k = 0; k < cues.length; k++) { if (t >= cues[k].t) i = k; else break; }
    return i;
  }, [cues]);

  // Speak beat i; when it ends, immediately start the next (continuous voice).
  const speakBeat = useCallback((i) => {
    if (i < 0 || i >= cues.length) { speakingRef.current = false; return; }
    beatRef.current = i;
    fromRef.current = posRef.current;
    inDurRef.current = clamp(Math.abs(cues[i].t - fromRef.current) * 0.05, 0.4, 0.9);
    segStartRef.current = performance.now();
    speakingRef.current = true;
    if (!('speechSynthesis' in window)) return;
    const text = cleanForSpeech(cues[i].text);
    try { window.speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text);
    const v = pickDutchVoice();
    if (v) u.voice = v;
    u.lang = 'nl-NL'; u.rate = VOICE_RATE; u.pitch = 1.0;
    let done = false;
    const next = () => {
      if (done) return; done = true;
      if (!voiceOnRef.current) { speakingRef.current = false; return; }
      const ni = i + 1;
      if (ni < cues.length) speakBeat(ni);
      else { speakingRef.current = false; setPlaying(false); }
    };
    u.onend = next; u.onerror = next;
    window.speechSynthesis.speak(u);
    // Watchdog in case onend never fires. Kept generous so it never fires
    // BEFORE a long sentence finishes (that would itself cut the speaker off).
    setTimeout(next, Math.min(32000, text.length * 125 + 4500));
  }, [cues, setPlaying]);

  // Start / stop narration mode
  useEffect(() => {
    if (voiceOn) {
      const i = activeCueIndex(timeRef.current);
      posRef.current = cues[i].t;
      fromRef.current = timeRef.current;
      segStartRef.current = performance.now();
      setPlaying(false);              // silence the Stage clock; we drive the playhead
      speakBeat(i);
      const loop = () => {
        if (!voiceOnRef.current) { rafRef.current = null; return; }
        // user scrubbed? re-sync to the new position
        if (Math.abs(timeRef.current - posRef.current) > 0.7) {
          const k = activeCueIndex(timeRef.current);
          posRef.current = timeRef.current;
          speakBeat(k);
        } else {
          const b = beatRef.current;
          const anchor = cues[b].t;
          const nextAnchor = (b + 1 < cues.length) ? cues[b + 1].t : (anchor + 4);
          const el = (performance.now() - segStartRef.current) / 1000;
          const inDur = inDurRef.current;
          let pos;
          if (el < inDur) {
            const e = Easing.easeInOutCubic(el / inDur);
            pos = fromRef.current + (anchor - fromRef.current) * e;
          } else {
            // Drift gently forward DURING the sentence, but never across this
            // sentence's own scene boundary — the slide must hold until the
            // next sentence actually starts, so the speaker is never cut off.
            const sceneEnd = sceneEndAfter(anchor);
            const drift = anchor + Math.min(DRIFT_MAX, (el - inDur) * DRIFT_RATE);
            pos = Math.max(anchor, Math.min(drift, nextAnchor - 0.15, sceneEnd - 0.25));
          }
          posRef.current = pos;
          setTime(pos);
        }
        rafRef.current = requestAnimationFrame(loop);
      };
      rafRef.current = requestAnimationFrame(loop);
      return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); rafRef.current = null; };
    } else {
      if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
      speakingRef.current = false;
      setPlaying(true);               // hand the clock back to the Stage
    }
  }, [voiceOn]);

  // Neutralise the Stage's own clock while narrating (so it doesn't fight us)
  useEffect(() => {
    if (voiceOn && playing) setPlaying(false);
  }, [voiceOn, playing]);

  useEffect(() => () => { if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} } }, []);
  return null;
}

function VoiceToggle({ on, onToggle, hasTTS }) {
  if (!hasTTS) return null;
  return (
    <div onClick={onToggle} className="vbtn" style={{
      cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8,
      padding: '7px 13px', borderRadius: 8,
      fontSize: 12.5, fontWeight: 700, letterSpacing: '0.3px',
      color: on ? '#001b10' : '#cfcfcf',
      background: on ? '#02CE80' : 'rgba(255,255,255,0.06)',
      border: `1px solid ${on ? '#02CE80' : 'rgba(255,255,255,0.14)'}`,
      transition: 'all .2s',
    }}>
      <span style={{ fontSize: 14 }}>{on ? '🔊' : '🔇'}</span>
      {on ? 'Stem aan' : 'Stem uit'}
    </div>
  );
}

function VideoHeader({ voiceOn, onToggle, hasTTS }) {
  return (
    <div style={{
      position: 'absolute', top: 0, left: 0, right: 0, zIndex: 60,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '10px 14px',
      background: 'linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 100%)',
    }}>
      <div style={{ fontFamily: "'Segoe UI', system-ui, sans-serif", fontSize: 11, fontWeight: 700, letterSpacing: '1.5px', textTransform: 'uppercase', color: 'rgba(255,255,255,0.45)' }}>
        Uitlegvideo
      </div>
      <VoiceToggle on={voiceOn} onToggle={onToggle} hasTTS={hasTTS} />
    </div>
  );
}

function SeekBridge() {
  const { setTime, setPlaying } = useTimeline();
  useEffect(() => {
    window.__seek = (t) => { setPlaying(false); setTime(t); };
    window.__jump = (t) => { setTime(t); };
    window.__play = (t) => { if (t != null) setTime(t); setPlaying(true); };
  }, [setTime, setPlaying]);
  return null;
}

function LabelTicker() {
  const time = useTime();
  useEffect(() => {
    const root = document.getElementById('video-root');
    if (root) {
      const m = Math.floor(time / 60), s = Math.floor(time % 60);
      root.setAttribute('data-screen-label', `${m}:${String(s).padStart(2, '0')}`);
    }
  }, [Math.floor(time)]);
  return null;
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [voiceOn, setVoiceOn] = useState(false);
  const [activeCh, setActiveCh] = useState(0);
  const hasTTS = typeof window !== 'undefined' && 'speechSynthesis' in window;

  useEffect(() => {
    if (hasTTS) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => {}; }
  }, []);

  const Scene = ({ a, b, children }) => <Sprite start={a} end={b}>{children}</Sprite>;

  return (
    <div id="video-root" data-screen-label="0:00" style={{ position: 'fixed', inset: 0 }}>
      <Stage width={1280} height={720} duration={T.end} background={C.bg} loop={false} autoplay={true} persistKey="instructievideo">
        <Scene a={T.introA} b={T.pipe}><SceneIntro /></Scene>
        <Scene a={T.pipe} b={T.src}><ScenePipeline /></Scene>
        <Scene a={T.src} b={T.mod}><SceneSources /></Scene>
        <Scene a={T.mod} b={T.agents}><SceneModules /></Scene>
        <Scene a={T.agents} b={T.nIntro}><SceneAgents /></Scene>
        <Scene a={T.nIntro} b={T.rules}><SceneNewIntro /></Scene>
        <Scene a={T.rules} b={T.dup}><SceneRules /></Scene>
        <Scene a={T.dup} b={T.comp}><SceneDuplicates /></Scene>
        <Scene a={T.comp} b={T.env}><SceneCompetitors /></Scene>
        <Scene a={T.env} b={T.ext}><SceneEnv /></Scene>
        <Scene a={T.ext} b={T.check}><SceneExternal /></Scene>
        <Scene a={T.check} b={T.outro}><SceneChecklist /></Scene>
        <Scene a={T.outro} b={T.end}><SceneOutro /></Scene>

        <ChapterRail chapters={CHAPTERS} active={activeCh} />
        <ChapterTracker chapters={CHAPTERS} onChange={setActiveCh} />
        <CaptionTrack cues={CUES} />
        <VideoHeader voiceOn={voiceOn} onToggle={() => setVoiceOn(v => !v)} hasTTS={hasTTS} />
        <Narrator cues={CUES} voiceOn={voiceOn} />
        <LabelTicker />
        <SeekBridge />
      </Stage>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
